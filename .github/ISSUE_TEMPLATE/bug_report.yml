name: Bug report
description: Something in Bitvoy doesn't work as it should.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This issue is **public**: don't include tokens, private code, or repository and workspace names you want to keep private. Security problems go to hello@bitvoyhq.com instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pull request
        2. Tap Files changed
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Android phone
        - Android tablet
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Profile → Settings → About & support → Version.
      placeholder: 1.0.0 (1)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 17 Pro, iOS 27.0.1
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional. Drag files in here. Blur anything private first.
